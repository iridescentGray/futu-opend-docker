name: futu-opend

services:
  futu-key-init:
    image: ${FUTU_OPEND_IMAGE:?set the release image reference}
    pull_policy: missing
    platform: linux/amd64
    user: root
    entrypoint: ["/usr/local/bin/init-futu-key"]
    restart: "no"
    network_mode: none
    environment:
      FUTU_OPEND_RSA_FILE_PATH: ${FUTU_OPEND_RSA_FILE_PATH:-/.futu/futu.pem}
    volumes:
      - type: bind
        source: ${LOCAL_RSA_FILE_PATH:-./futu.pem}
        target: /source/futu.pem
        read_only: true
        bind:
          create_host_path: false
      - futu-opend-key:/.futu

  futu-opend:
    image: ${FUTU_OPEND_IMAGE:?set the release image reference}
    pull_policy: missing
    platform: linux/amd64
    container_name: futu-opend
    user: futu
    restart: "on-failure:3"
    stop_grace_period: 30s
    stdin_open: false
    tty: false
    depends_on:
      futu-key-init:
        condition: service_completed_successfully
    environment:
      HOME: /home/futu
      FUTU_LOGIN_MODE: ${FUTU_LOGIN_MODE:-remember}
      FUTU_ACCOUNT_ID: ${FUTU_ACCOUNT_ID:-}
      FUTU_ACCOUNT_AREA_CODE: ${FUTU_ACCOUNT_AREA_CODE:-}
      FUTU_OPEND_IP: ${FUTU_OPEND_IP:-0.0.0.0}
      FUTU_OPEND_PORT: ${FUTU_OPEND_PORT:-11111}
      FUTU_OPEND_TELNET_IP: ${FUTU_OPEND_TELNET_IP:-127.0.0.1}
      FUTU_OPEND_TELNET_PORT: ${FUTU_OPEND_TELNET_PORT-}
      FUTU_OPEND_WEBSOCKET_IP: ${FUTU_OPEND_WEBSOCKET_IP:-127.0.0.1}
      FUTU_OPEND_WEBSOCKET_PORT: ${FUTU_OPEND_WEBSOCKET_PORT-}
      FUTU_OPEND_RSA_FILE_PATH: ${FUTU_OPEND_RSA_FILE_PATH:-/.futu/futu.pem}
    ports:
      - name: api
        target: ${FUTU_OPEND_PORT:-11111}
        published: "${FUTU_OPEND_PORT:-11111}"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - futu-opend-key:/.futu:ro
      - futu-opend-data:/home/futu/.com.futunn.FutuOpenD
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test "$$(cat /proc/1/comm)" = FutuOpenD &&
          grep -Fq "<api_port>$${FUTU_OPEND_PORT}</api_port>"
          "$${FUTU_OPEND_RUNTIME_CONFIG:-/tmp/FutuOpenD.xml}"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    internal: false

volumes:
  futu-opend-key:
  futu-opend-data:
