services:
  futu-key-init:
    platform: linux/amd64
    build:
      context: .
      target: runtime
      args:
        FUTU_OPEND_VER: ${FUTU_OPEND_VER:?set the locked OpenD version}
        FUTU_OPEND_SHA256: ${FUTU_OPEND_SHA256:?record the reviewed OpenD artifact SHA-256}
    user: root
    entrypoint: ["/usr/local/bin/init-futu-key"]
    restart: "no"
    network_mode: none
    environment:
      FUTU_OPEND_RSA_FILE_PATH: ${FUTU_OPEND_RSA_FILE_PATH:-/.futu/futu.pem}
    volumes:
      - type: bind
        source: ${LOCAL_RSA_FILE_PATH:?set LOCAL_RSA_FILE_PATH to a mode-0600 test or private key}
        target: /source/futu.pem
        read_only: true
        bind:
          create_host_path: false
          # Private relabel for SELinux-enforcing rootless Podman hosts.
          selinux: Z
      - futu-opend-key:/.futu

  futu-opend:
    platform: linux/amd64
    build:
      context: .
      target: runtime
      args:
        FUTU_OPEND_VER: ${FUTU_OPEND_VER:?set the locked OpenD version}
        FUTU_OPEND_SHA256: ${FUTU_OPEND_SHA256:?record the reviewed OpenD artifact SHA-256}
    container_name: futu-opend
    user: futu
    restart: "on-failure:3"
    stop_grace_period: 30s
    stdin_open: false
    tty: false
    depends_on:
      futu-key-init:
        condition: service_completed_successfully
    environment:
      HOME: /home/futu
      FUTU_LOGIN_MODE: ${FUTU_LOGIN_MODE:-remember}
      FUTU_OPEND_VERSION: ${FUTU_OPEND_VER}
      FUTU_ACCOUNT_ID: ${FUTU_ACCOUNT_ID:-}
      FUTU_ACCOUNT_AREA_CODE: ${FUTU_ACCOUNT_AREA_CODE:-}
      FUTU_ACCOUNT_PWD_MD5: ${FUTU_ACCOUNT_PWD_MD5:-}
      FUTU_ACCOUNT_PWD: ${FUTU_ACCOUNT_PWD:-}
      # Bridge containers reach this service through its container interface.
      FUTU_OPEND_IP: ${FUTU_OPEND_IP:-0.0.0.0}
      FUTU_OPEND_PORT: ${FUTU_OPEND_PORT:-11111}
      # Unset and explicitly empty both mean disabled for optional listeners.
      FUTU_OPEND_TELNET_IP: ${FUTU_OPEND_TELNET_IP:-127.0.0.1}
      FUTU_OPEND_TELNET_PORT: ${FUTU_OPEND_TELNET_PORT-}
      FUTU_OPEND_WEBSOCKET_IP: ${FUTU_OPEND_WEBSOCKET_IP:-127.0.0.1}
      FUTU_OPEND_WEBSOCKET_PORT: ${FUTU_OPEND_WEBSOCKET_PORT-}
      FUTU_OPEND_RSA_FILE_PATH: ${FUTU_OPEND_RSA_FILE_PATH:-/.futu/futu.pem}
    ports:
      - name: api
        target: ${FUTU_OPEND_PORT:-11111}
        published: "${FUTU_OPEND_PORT:-11111}"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - futu-opend-key:/.futu:ro
      - futu-opend-data:/home/futu/.com.futunn.FutuOpenD
    healthcheck:
      # Liveness only: this does not prove login, API readiness, or session validity.
      test:
        - CMD-SHELL
        - >-
          test "$$(cat /proc/1/comm)" = FutuOpenD &&
          grep -Fq "<api_port>$${FUTU_OPEND_PORT}</api_port>"
          "$${FUTU_OPEND_RUNTIME_CONFIG:-/tmp/FutuOpenD.xml}"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    internal: false

volumes:
  futu-opend-key:
  futu-opend-data:
