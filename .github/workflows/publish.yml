name: Publish trusted image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm

      - name: Install locked test dependencies
        run: npm ci

      - name: Install login-proxy test dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes expect

      - name: Run Layer 1 JavaScript unit tests
        run: npm run test:unit

      - name: Run Layer 1 shell and configuration tests
        run: npm run test:offline

      - name: Report Layer 3 default status
        run: npm run test:live

      - name: Select explicit image tag
        run: |
          set -euo pipefail
          VERSION=$(node -e "process.stdout.write(require('./opend_version.json').stableVersion)")
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Invalid stable OpenD version' >&2
            exit 1
          fi
          IMAGE_NAME=$(printf '%s' "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "SMOKE_IMAGE=${IMAGE_NAME}:ubuntu-${VERSION}" >>"$GITHUB_ENV"

      - name: Run Layer 2 against the exact image to publish
        run: npm run test:smoke
        env:
          SMOKE_KEEP_IMAGE: "1"

      - name: Install Podman Compose provider
        run: sudo apt-get install --yes podman podman-compose

      - name: Run rootless Podman build, Compose, and key-volume smoke
        run: bash script/podman_smoke.test.sh
        env:
          PODMAN_COMPOSE_PROVIDER: podman-compose
          PODMAN_SMOKE_REQUIRED: "1"

      - name: Authenticate to GHCR after all test gates
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push tested explicit version tag
        run: docker push "$SMOKE_IMAGE"
