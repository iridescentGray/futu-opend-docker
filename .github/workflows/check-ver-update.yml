name: Propose Futu OpenD version update

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  propose-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check and synchronize version metadata
        run: |
          node script/check_version.js
          node script/update_docs_version.js

      - name: Create a review-only pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SYNC_FILES="opend_version.json $(node -e "console.log(require('./script/update_docs_version.js').TARGET_FILES.join(' '))")"
          if git diff --quiet -- $SYNC_FILES; then
            echo 'No version update needed'
            exit 0
          fi

          VERSION=$(node -e "process.stdout.write(require('./opend_version.json').stableVersion)")
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Invalid proposed version' >&2
            exit 1
          fi
          BRANCH="update-futu-opend-${VERSION}"
          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')" != 0 ]; then
            echo "An open review PR already exists for ${BRANCH}"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add -- $SYNC_FILES
          git commit -m "Propose Futu OpenD ${VERSION}"
          git push --set-upstream origin "$BRANCH"

          gh pr create \
            --title "Propose Futu OpenD ${VERSION}" \
            --body "Automated version proposal. Human review and a new artifact-integrity lock are required. This workflow does not auto-merge, publish, or deploy." \
            --base main \
            --head "$BRANCH"

          echo 'Review PR created. No merge or deployment was requested.'
