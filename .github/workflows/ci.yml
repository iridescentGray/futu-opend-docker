name: Pull request CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layer1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build_required: ${{ steps.changes.outputs.build_required }}
    steps:
      - name: Checkout untrusted source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify the only allowed Layer 2 skip
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != pull_request ]; then
            echo 'build_required=true' >>"$GITHUB_OUTPUT"
            exit 0
          fi

          build_required=false
          while IFS= read -r changed; do
            case "$changed" in
              README.md|AGENTS.md|CLAUDE.md|LICENSE|docs/*) ;;
              *) build_required=true ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")
          echo "build_required=${build_required}" >>"$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm

      - name: Install locked test dependencies
        run: npm ci

      - name: Install login-proxy test dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes expect

      - name: Run Layer 1 JavaScript unit tests
        run: npm run test:unit

      - name: Run Layer 1 shell and configuration tests
        run: npm run test:offline

      - name: Report Layer 3 default status
        run: npm run test:live

  layer2:
    needs: layer1
    if: needs.layer1.result == 'success' && needs.layer1.outputs.build_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout untrusted source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run Layer 2 isolated container smoke
        run: bash script/container_smoke.test.sh

  podman:
    needs: layer1
    if: needs.layer1.result == 'success' && needs.layer1.outputs.build_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      PODMAN_COMPOSE_PROVIDER: podman-compose
      PODMAN_SMOKE_REQUIRED: "1"
    steps:
      - name: Checkout untrusted source without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Install Podman Compose provider
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman podman-compose

      - name: Report rootless Podman and Compose versions
        run: |
          podman version
          podman compose version
          podman info --format 'rootless={{.Host.Security.Rootless}} os={{.Host.OS}} arch={{.Host.Arch}}'

      - name: Run rootless Podman build, Compose, and key-volume smoke
        run: bash script/podman_smoke.test.sh

  ci-gate:
    if: always()
    needs: [layer1, layer2, podman]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout gate implementation without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Require intended Layer 1, Docker, and Podman outcomes
        env:
          LAYER1_RESULT: ${{ needs.layer1.result }}
          LAYER2_RESULT: ${{ needs.layer2.result }}
          PODMAN_RESULT: ${{ needs.podman.result }}
          BUILD_REQUIRED: ${{ needs.layer1.outputs.build_required }}
        run: |
          bash script/ci_gate.sh
